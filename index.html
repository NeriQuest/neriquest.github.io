<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NeriQuest - Developer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <img src="images/logo.png" alt="NeriQuest Logo" class="logo">
    <h1>Welcome to NeriQuest</h1>
  </header>

  <section class="app-section">
    <div class="app">
      <a href="expensemate/" style="text-decoration: none; color: inherit;">
        <img src="images/expenseMate_banner.jpeg" alt="ExpenseMate Banner" class="app-banner">
        <h2>ExpenseMate</h2>
      </a>
      <p style="margin: 10px 0 20px;">
        <a href="expensemate/" style="display: inline-block; padding: 8px 18px; background: #22c55e; color: #0b1710; border-radius: 6px; text-decoration: none; font-weight: bold; font-size: 0.95rem;">View ExpenseMate Page &rarr;</a>
      </p>
      <div class="app-screenshots">
        <img src="images/expenseSS1.jpeg" alt="ExpenseMate Screenshot">
        <img src="images/expenseSS2.jpeg" alt="ExpenseMate Screenshot">
        <img src="images/expenseSS3.jpeg" alt="ExpenseMate Screenshot">
        <img src="images/expenseSS4.jpeg" alt="ExpenseMate Screenshot">
        <img src="images/expenseSS5.jpeg" alt="ExpenseMate Screenshot">
        <img src="images/expenseSS6.jpeg" alt="ExpenseMate Screenshot">
        <img src="images/expenseSS7.jpeg" alt="ExpenseMate Screenshot">
        <img src="images/expenseSS8.jpeg" alt="ExpenseMate Screenshot">
        <!-- more screenshots -->
      </div>
    </div>

    <div class="app">
      <img src="images/chessTimer_banner.png" alt="ChessTimer Banner" class="app-banner">
      <h2>ChessTimer</h2>
      <div class="app-screenshots">
        <img src="images/chessSS1.png" alt="ChessTimer Screenshot">
        <img src="images/chessSS2.png" alt="ChessTimer Screenshot">
        <img src="images/chessSS3.png" alt="ChessTimer Screenshot">
        <img src="images/chessSS4.png" alt="ChessTimer Screenshot">
        <img src="images/chessSS5.png" alt="ChessTimer Screenshot">
        <img src="images/chessSS6.png" alt="ChessTimer Screenshot">
        <img src="images/chessSS7.png" alt="ChessTimer Screenshot">
        <!-- more screenshots -->
      </div>
    </div>

    <div class="app">
      <img src="images/calculator_banner.png" alt="Calculator Banner" class="app-banner">
      <h2>Calculator</h2>
      <div class="app-screenshots">
        <img src="images/screenshot5.jpeg" alt="Calculator Screenshot">
        <img src="images/screenshot6.jpeg" alt="Calculator Screenshot">
        <!-- more screenshots -->
      </div>
    </div>
  </section>

  <script src="app.js"></script>
</body>
</html>
